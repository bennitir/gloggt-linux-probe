name: Synthetic rootless isolation probe
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: synthetic-rootless-isolation
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'bennitir/gloggt-linux-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Synthetic boundaries only
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          umask 077
          probe_dir="$(mktemp -d /tmp/gloggt-isolation.XXXXXX)"
          cat > "$probe_dir/probe.py" <<'PYTHON'
          """Synthetic rootless boundary probe. No project code, credentials or downloads."""
          import ctypes
          import errno
          import json
          import os
          from pathlib import Path
          import platform
          import signal
          import socket
          import stat
          import subprocess
          import sys
          import tempfile
          import time
          
          MEMORY = 268435456
          TASKS = 16
          SCRATCH = 16777216
          OUTPUT = 2097152
          SAFE_ENV = {"PATH": "/usr/bin:/bin", "LANG": "C.UTF-8",
                      "HOME": "/scratch", "TMPDIR": "/scratch", "PWD": "/scratch"}
          DENIED = {errno.EACCES, errno.EPERM}
          READ_ONLY = DENIED | {errno.EROFS}
          ABSENT = READ_ONLY | {errno.ENOENT, errno.ENOTDIR}
          LIBC = None
          
          
          def check(value, label):
              if not value:
                  raise RuntimeError(label)
          
          
          def denied(fn, allowed):
              try:
                  result = fn()
              except OSError as exc:
                  check(exc.errno in allowed, "unexpected-denial")
              else:
                  if hasattr(result, "close"):
                      result.close()
                  raise RuntimeError("operation-not-denied")
          
          
          def libc():
              global LIBC
              if LIBC is None:
                  LIBC = ctypes.CDLL(None, use_errno=True)
              return LIBC
          
          
          def denied_syscall(number, *args):
              ctypes.set_errno(0)
              result = libc().syscall(ctypes.c_long(number), *args)
              check(result == -1 and ctypes.get_errno() == errno.EPERM,
                    "syscall-not-denied")
          
          
          def inner():
              mode = sys.argv[2]
              outer = json.loads(Path("/control/outer.json").read_text())
              check(os.getuid() != 0 and os.geteuid() != 0, "root-identity")
              status = dict(line.split(":", 1) for line in
                            Path("/proc/self/status").read_text().splitlines()
                            if ":" in line)
              for cap in ("CapInh", "CapPrm", "CapEff", "CapBnd", "CapAmb"):
                  check(int(status[cap].strip(), 16) == 0, "capabilities")
              check(status["NoNewPrivs"].strip() == "1", "no-new-privileges")
              check(status["Seccomp"].strip() == "2", "seccomp")
              for name, identity in outer["namespaces"].items():
                  check(os.readlink("/proc/self/ns/" + name) != identity,
                        "shared-namespace")
              check(dict(os.environ) == SAFE_ENV, "environment-not-clean")
              for fd in os.listdir("/proc/self/fd"):
                  try:
                      os.readlink("/proc/self/fd/" + fd)
                  except FileNotFoundError:
                      continue
                  check(int(fd) <= 2, "inherited-descriptor")
              # Only private PID namespace processes are visible. Never inspect host secrets.
              marker = outer["marker"].encode()
              for proc in Path("/proc").iterdir():
                  if proc.name.isdigit():
                      try:
                          data = (proc / "environ").read_bytes()
                      except (FileNotFoundError, PermissionError):
                          continue
                      check(marker not in data, "synthetic-host-environment-visible")
              for path in (outer["host_file"], "/home/runner", "/run", "/sys",
                           "/proc/1/root" + outer["host_file"],
                           "/proc/" + str(outer["host_pid"]) + "/environ"):
                  denied(lambda p=path: open(p, "rb"), ABSENT)
              check(Path("/project/canary").read_text() == "synthetic-read-only",
                    "positive-read")
              Path("/scratch/ok").write_text("synthetic-write")
              check(Path("/scratch/ok").read_text() == "synthetic-write", "positive-write")
              Path("/project/app/generated/prisma/ok").write_text("synthetic-output")
              for path in ("/project/canary", "/control/probe.py", "/logs/canary",
                           "/outside", "/usr/new-file", "/limits/cgroup.procs"):
                  denied(lambda p=path: open(p, "w"), READ_ONLY)
              os.symlink(outer["host_file"], "/scratch/escape")
              denied(lambda: open("/scratch/escape", "rb"), ABSENT)
              os.symlink("/project/canary", "/scratch/readonly-link")
              denied(lambda: open("/scratch/readonly-link", "w"), READ_ONLY)
              denied(lambda: os.link("/project/canary", "/scratch/hardlink"),
                     READ_ONLY | {errno.EXDEV})
              denied(lambda: os.setuid(0), DENIED)
              # x86-64 syscalls: mount, ptrace, unshare, setns.
              denied_syscall(165, 0, 0, 0, 0, 0)
              denied_syscall(101, 0, 0, 0, 0)
              denied_syscall(272, 0x10000000)
              denied_syscall(308, -1, 0)
              # Denial is EPERM at socket creation, not DNS failure or connection refusal.
              # TLS requires TCP; DNS requires UDP/TCP. Both transports and both IP
              # families are denied before any packet or real endpoint can be used.
              for family in (socket.AF_INET, socket.AF_INET6, socket.AF_UNIX):
                  for kind in (socket.SOCK_STREAM, socket.SOCK_DGRAM):
                      denied(lambda f=family, k=kind: socket.socket(f, k), {errno.EPERM})
              denied(lambda: socket.socketpair(), {errno.EPERM})
              check(int(Path("/limits/memory.max").read_text()) == MEMORY, "memory-limit")
              check(int(Path("/limits/memory.swap.max").read_text()) == 0, "swap-limit")
              check(int(Path("/limits/pids.max").read_text()) == TASKS, "task-limit")
              # Two bounded tmpfs mounts; actually exercise ENOSPC with at most 3 MiB.
              for directory, maximum in (("/scratch", SCRATCH),
                                         ("/project/app/generated/prisma", OUTPUT)):
                  info = os.statvfs(directory)
                  check(info.f_blocks * info.f_frsize <= maximum, "disk-limit")
              exhausted = False
              try:
                  with open("/project/app/generated/prisma/fill", "wb", buffering=0) as out:
                      for _ in range(48):
                          out.write(b"x" * 65536)
              except OSError as exc:
                  check(exc.errno == errno.ENOSPC, "disk-denial")
                  exhausted = True
              check(exhausted, "disk-limit-not-enforced")
              if mode == "boundaries":
                  # Fixed, bounded loop; never recursively forks.
                  children = []
                  limited = False
                  try:
                      for _ in range(TASKS + 1):
                          try:
                              pid = os.fork()
                          except OSError as exc:
                              check(exc.errno == errno.EAGAIN, "fork-denial")
                              limited = True
                              break
                          if pid == 0:
                              time.sleep(15)
                              os._exit(0)
                          children.append(pid)
                      check(limited, "task-limit-not-enforced")
                  finally:
                      for pid in children:
                          os.kill(pid, signal.SIGKILL)
                          os.waitpid(pid, 0)
                  check(Path("/project/canary").read_text() == "synthetic-read-only",
                        "source-modified")
                  print("PASS_BOUNDARIES", flush=True)
              elif mode == "timeout":
                  # A detached grandchild ignores TERM; only the owned cgroup is killed.
                  pid = os.fork()
                  if pid == 0:
                      os.setsid()
                      child = os.fork()
                      if child:
                          os._exit(0)
                      signal.signal(signal.SIGTERM, signal.SIG_IGN)
                      while True:
                          time.sleep(1)
                  os.waitpid(pid, 0)
                  print("READY_TIMEOUT", flush=True)
                  while True:
                      time.sleep(1)
              else:
                  raise RuntimeError("invalid-mode")
          
          
          def delegated_parent():
              mount = Path("/sys/fs/cgroup")
              check((mount / "cgroup.controllers").is_file(), "cgroup-v2-unavailable")
              line = next((s for s in Path("/proc/self/cgroup").read_text().splitlines()
                           if s.startswith("0::")), None)
              check(line is not None, "cgroup-membership")
              current = (mount / line[3:].lstrip("/")).resolve()
              check(current.is_relative_to(mount) and current != mount, "cgroup-path")
              # Never enable parent controllers or change a system-owned hierarchy.
              for candidate in (current, *current.parents):
                  if candidate == mount:
                      break
                  try:
                      delegated = os.getxattr(candidate, "user.delegate") == b"1"
                      enabled = set((candidate / "cgroup.subtree_control").read_text().split())
                      if delegated and {"memory", "pids"} <= enabled and os.access(candidate, os.W_OK):
                          return candidate
                  except OSError:
                      continue
              raise RuntimeError("BLOCKED_NO_EXISTING_CGROUP_DELEGATION")
          
          
          def export_filter(path):
              sec = ctypes.CDLL("libseccomp.so.2")
              sec.seccomp_init.argtypes = [ctypes.c_uint32]
              sec.seccomp_init.restype = ctypes.c_void_p
              sec.seccomp_syscall_resolve_name.argtypes = [ctypes.c_char_p]
              sec.seccomp_syscall_resolve_name.restype = ctypes.c_int
              sec.seccomp_rule_add.argtypes = [ctypes.c_void_p, ctypes.c_uint32,
                                              ctypes.c_int, ctypes.c_uint]
              sec.seccomp_export_bpf.argtypes = [ctypes.c_void_p, ctypes.c_int]
              sec.seccomp_release.argtypes = [ctypes.c_void_p]
              context = sec.seccomp_init(0x7fff0000)  # ALLOW, with explicit denials below.
              check(bool(context), "seccomp-init")
              names = ("socket socketpair connect bind listen accept accept4 sendto sendmsg "
                       "sendmmsg unshare setns mount umount2 pivot_root chroot ptrace "
                       "process_vm_readv process_vm_writev open_by_handle_at name_to_handle_at "
                       "bpf perf_event_open keyctl add_key request_key reboot kexec_load "
                       "kexec_file_load init_module finit_module delete_module userfaultfd "
                       "io_uring_setup io_uring_enter io_uring_register").split()
              try:
                  for name in names:
                      number = sec.seccomp_syscall_resolve_name(name.encode())
                      check(number >= 0, "unknown-syscall")
                      check(sec.seccomp_rule_add(context, 0x50000 | errno.EPERM,
                                                number, 0) == 0, "seccomp-rule")
                  # libc can fall back to clone/fork. New user namespaces are also
                  # disabled by bwrap; namespace-changing clone flags are filtered.
                  number = sec.seccomp_syscall_resolve_name(b"clone3")
                  check(number >= 0, "clone3")
                  check(sec.seccomp_rule_add(context, 0x50000 | errno.ENOSYS, number, 0) == 0,
                        "clone3-rule")
                  class Compare(ctypes.Structure):
                      _fields_ = [("arg", ctypes.c_uint), ("op", ctypes.c_int),
                                  ("a", ctypes.c_uint64), ("b", ctypes.c_uint64)]
                  sec.seccomp_rule_add_array.argtypes = [ctypes.c_void_p, ctypes.c_uint32,
                                                         ctypes.c_int, ctypes.c_uint,
                                                         ctypes.POINTER(Compare)]
                  number = sec.seccomp_syscall_resolve_name(b"clone")
                  for flag in (0x80, 0x20000, 0x02000000, 0x04000000, 0x08000000,
                               0x10000000, 0x20000000, 0x40000000):
                      cmp = Compare(0, 7, flag, flag)  # SCMP_CMP_MASKED_EQ
                      check(sec.seccomp_rule_add_array(context, 0x50000 | errno.EPERM,
                                                      number, 1, ctypes.byref(cmp)) == 0,
                            "clone-rule")
                  with open(path, "wb") as out:
                      check(sec.seccomp_export_bpf(context, out.fileno()) == 0, "bpf-export")
              finally:
                  sec.seccomp_release(context)
          
          
          def positive_network_controls():
              # Only loopback canaries. Never contacts an external address or DNS server.
              for family, address in ((socket.AF_INET, "127.0.0.1"),
                                      (socket.AF_INET6, "::1")):
                  with socket.socket(family, socket.SOCK_STREAM) as server:
                      server.settimeout(2)
                      server.bind((address, 0))
                      server.listen(1)
                      with socket.socket(family, socket.SOCK_STREAM) as client:
                          client.settimeout(2)
                          client.connect(server.getsockname())
                          peer, _ = server.accept()
                          with peer:
                              peer.settimeout(2)
                              client.sendall(b"synthetic-tcp")
                              check(peer.recv(64) == b"synthetic-tcp", "tcp-control")
                  with socket.socket(family, socket.SOCK_DGRAM) as server:
                      server.settimeout(2)
                      server.bind((address, 0))
                      with socket.socket(family, socket.SOCK_DGRAM) as client:
                          client.sendto(b"synthetic-dns-transport", server.getsockname())
                          check(server.recv(64) == b"synthetic-dns-transport", "udp-control")
              # TLS/DNS application exchanges are not claimed: their TCP/UDP transport
              # is proven working here and forbidden by seccomp in the sandbox.
          
          
          def supervisor():
              check(platform.system() == "Linux" and platform.machine() == "x86_64",
                    "linux-x64-required")
              check(os.getuid() != 0 and os.geteuid() != 0, "root-refused")
              bwrap = Path("/usr/bin/bwrap")
              check(bwrap.is_file(), "BLOCKED_BWRAP_NOT_PREINSTALLED")
              check(not (bwrap.stat().st_mode & (stat.S_ISUID | stat.S_ISGID)),
                    "setid-bwrap-refused")
              for runtime in (bwrap, Path("/usr/bin/python3").resolve(),
                              Path("/usr/lib"), Path("/usr/lib64")):
                  s = runtime.stat()
                  check(s.st_uid == 0 and not (s.st_mode & 0o022), "runtime-owner")
              parent = delegated_parent()
              print("PASS prerequisite: existing rootless cgroup delegation", flush=True)
              # No user-controlled temp location or project checkout.
              folder = Path(tempfile.mkdtemp(prefix="synthetic-boundary-", dir="/tmp"))
              cg = parent / folder.name
              process = None
              canary = None
              phase = "setup"
              def kill_owned():
                  if (cg / "cgroup.kill").exists():
                      (cg / "cgroup.kill").write_text("1")
                  if process is not None:
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          raise RuntimeError("owned-cgroup-kill-failed")
                  deadline = time.monotonic() + 5
                  while time.monotonic() < deadline:
                      if "populated 0" in (cg / "cgroup.events").read_text():
                          return
                      time.sleep(0.05)
                  raise RuntimeError("owned-cgroup-still-populated")
              try:
                  cg.mkdir()
                  for name, value in (("memory.max", MEMORY), ("memory.swap.max", 0),
                                      ("pids.max", TASKS)):
                      (cg / name).write_text(str(value))
                      check((cg / name).read_text().strip() == str(value), "cgroup-limit")
                  check(os.access(cg / "cgroup.kill", os.W_OK), "cgroup-kill-unavailable")
                  positive_network_controls()
                  for name in ("control", "project/app/generated/prisma", "logs"):
                      (folder / name).mkdir(parents=True, exist_ok=True)
                  (folder / "project/canary").write_text("synthetic-read-only")
                  (folder / "logs/canary").write_text("synthetic-log")
                  host_file = folder / "host-only-canary"
                  host_file.write_text("synthetic-host-file")
                  marker = "SYNTHETIC_ONLY_" + folder.name
                  canary = subprocess.Popen(
                      ["/usr/bin/python3", "-I", "-B", "-c", "import time; time.sleep(90)"],
                      env=dict(SAFE_ENV, SYNTHETIC_HOST_TOKEN=marker),
                      stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL, close_fds=True)
                  check(marker.encode() in Path("/proc/" + str(canary.pid) + "/environ").read_bytes(),
                        "host-environment-positive-control")
                  control = folder / "control"
                  (control / "probe.py").write_bytes(Path(__file__).read_bytes())
                  (control / "outer.json").write_text(json.dumps({
                      "host_file": str(host_file), "host_pid": canary.pid, "marker": marker,
                      "namespaces": {n: os.readlink("/proc/self/ns/" + n)
                                     for n in ("user", "mnt", "pid", "net", "ipc", "uts", "cgroup")}
                  }))
                  filter_path = folder / "filter.bpf"
                  export_filter(filter_path)
                  def enter_group():
                      (cg / "cgroup.procs").write_text(str(os.getpid()))
                      check(libc().prctl(38, 1, 0, 0, 0) == 0, "nnp-setup")
                  for mode in ("boundaries", "timeout"):
                      phase = mode
                      with open(filter_path, "rb") as policy:
                          args = [str(bwrap), "--unshare-user", "--unshare-pid",
                                  "--unshare-net", "--unshare-ipc", "--unshare-uts",
                                  "--unshare-cgroup", "--disable-userns",
                                  "--assert-userns-disabled", "--die-with-parent",
                                  "--new-session", "--uid", str(os.getuid()),
                                  "--gid", str(os.getgid()), "--cap-drop", "ALL",
                                  "--clearenv"]
                          for key, value in SAFE_ENV.items():
                              args += ["--setenv", key, value]
                          args += ["--ro-bind", "/usr/lib", "/usr/lib",
                                   "--ro-bind", "/usr/lib64", "/usr/lib64",
                                   "--symlink", "usr/lib", "/lib",
                                   "--symlink", "usr/lib64", "/lib64",
                                   "--ro-bind", str(Path("/usr/bin/python3").resolve()),
                                   "/usr/bin/python3",
                                   "--ro-bind", "/etc/ld.so.cache", "/etc/ld.so.cache",
                                   "--ro-bind", str(control), "/control",
                                   "--ro-bind", str(folder / "project"), "/project",
                                   "--ro-bind", str(folder / "logs"), "/logs",
                                   "--ro-bind", str(cg), "/limits",
                                   "--proc", "/proc", "--dir", "/dev",
                                   "--ro-bind", "/dev/null", "/dev/null",
                                   "--size", str(SCRATCH), "--tmpfs", "/scratch",
                                   "--size", str(OUTPUT), "--tmpfs",
                                   "/project/app/generated/prisma",
                                   "--chdir", "/scratch", "--remount-ro", "/",
                                   "--seccomp", str(policy.fileno()),
                                   "/usr/bin/python3", "-I", "-B", "/control/probe.py",
                                   "--inner", mode]
                          environment = dict(SAFE_ENV)
                          # Clean environment, no other inherited FDs; no host token is read.
                          process = subprocess.Popen(args, env=environment,
                              stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                              stderr=subprocess.PIPE, close_fds=True,
                              pass_fds=(policy.fileno(),), preexec_fn=enter_group)
                          timed_out = False
                          try:
                              out, err = process.communicate(timeout=30 if mode == "boundaries" else 3)
                          except subprocess.TimeoutExpired:
                              timed_out = True
                              kill_owned()
                              out, err = process.communicate(timeout=2)
                          # Raw synthetic diagnostics stay outside all sandbox mounts.
                          (folder / (mode + ".stdout.log")).write_bytes(out)
                          (folder / (mode + ".stderr.log")).write_bytes(err)
                          if mode == "boundaries":
                              check(not timed_out and process.returncode == 0
                                    and out == b"PASS_BOUNDARIES\n" and not err,
                                    "boundary-test-failed")
                              events = dict(line.split() for line in
                                            (cg / "pids.events").read_text().splitlines())
                              check(int(events.get("max", "0")) > 0, "pids-limit-not-hit")
                              check("populated 0" in (cg / "cgroup.events").read_text(),
                                    "child-survived")
                              print("PASS synthetic network/files/identity/credentials/PID/disk boundaries",
                                    flush=True)
                          else:
                              check(timed_out and out == b"READY_TIMEOUT\n" and not err,
                                    "timeout-control-failed")
                              print("PASS owned cgroup kill including detached descendant", flush=True)
                          process = None
                  print("PASS SYNTHETIC_ONLY; NOT authorization for Prisma or TypeScript", flush=True)
              except BaseException:
                  # Never kill the runner job, a parent cgroup or a shared user slice.
                  if cg.is_dir():
                      try:
                          kill_owned()
                      except Exception:
                          print("FAIL cleanup of owned cgroup; stop job", flush=True)
                  print("FAIL synthetic phase: " + phase + "; no fallback or retry", flush=True)
                  raise
              finally:
                  if canary is not None:
                      canary.kill()
                      canary.wait(timeout=5)
                  # Preserve only synthetic files until the ephemeral runner is discarded.
                  # Logs live in supervisor pipes, never a sandbox-writable host directory.
                  if cg.is_dir() and "populated 0" in (cg / "cgroup.events").read_text():
                      cg.rmdir()
          
          
          if __name__ == "__main__":
              try:
                  if len(sys.argv) > 1 and sys.argv[1] == "--inner":
                      inner()
                  else:
                      supervisor()
              except BaseException as exc:
                  # Fixed labels only: never print exception text, environment or raw stderr.
                  if isinstance(exc, RuntimeError) and str(exc).startswith("BLOCKED_"):
                      print(str(exc), flush=True)
                  else:
                      print("FAIL synthetic isolation probe; no workload authorized", flush=True)
                  sys.exit(1)
          PYTHON
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/python3 -I -B "$probe_dir/probe.py"
